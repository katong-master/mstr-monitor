<div class="grid grid-cols-1 lg:grid-cols-3 gap-8 pb-12">
    <div class="bg-slate-900 p-6 rounded-xl shadow-lg text-white flex flex-col h-[600px]">
        <div class="flex items-center mb-4">
            <div class="w-8 h-8 bg-blue-500 rounded-lg flex items-center justify-center mr-3">
                <span class="text-xs">AI</span>
            </div>
            <h3 class="font-bold text-lg">DAT.co 策略助手</h3>
        </div>
        
        <div id="chat-window" class="flex-grow overflow-y-auto space-y-4 mb-4 pr-2 text-sm scrollbar-thin scrollbar-thumb-slate-700">
            <div class="text-gray-400 italic">準備就緒，請點擊按鈕生成分析報告...</div>
        </div>

        <div id="chat-input-area" class="hidden flex gap-2 border-t border-slate-800 pt-4">
            <input type="text" id="user-input" 
                   class="flex-grow bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 text-white" 
                   placeholder="詢問更多細節...">
            <button onclick="handleUserQuery()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-sm font-bold transition">送出</button>
        </div>

        <button id="generate-btn" onclick="startAIAnalysis()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg transition">
            Generate Analysis
        </button>
    </div>
</div>

<script type="importmap">
{
    "imports": {
        "@google/generative-ai": "https://esm.run/@google/generative-ai"
    }
}
</script>

<script type="module">
    import { GoogleGenerativeAI } from "@google/generative-ai";

    // 注意：在靜態網頁中，這把 Key 是公開的。
    const API_KEY = "你的_GEMINI_API_KEY"; 
    const genAI = new GoogleGenerativeAI(API_KEY);
    const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

    let chat = null;

    // 1. 初始化分析：讀取 JSON 並發出第一個指令
    window.startAIAnalysis = async () => {
        const chatWindow = document.getElementById('chat-window');
        const genBtn = document.getElementById('generate-btn');
        const inputArea = document.getElementById('chat-input-area');

        chatWindow.innerHTML = '<div class="text-blue-400 animate-pulse">正在讀取數據並分析趨勢...</div>';
        genBtn.style.display = 'none';

        try {
            // 讀取你的 indicator.json
            const response = await fetch('indicator.json');
            const jsonData = await response.json();

            // 準備餵給 AI 的上下文
            const context = `
                你是一位專業的比特幣投資分析師。
                以下是當前的市場監測數據：
                - 最新日期：${jsonData.summary.latestDate}
                - 比特幣持倉：${jsonData.summary.latestBtcHoldings} BTC
                - 每股權益 (NAV)：$${jsonData.summary.latestBtcNavPerDilutedShareUsd}
                - 比特幣價格：$${jsonData.summary.latestBtcPriceUsd}
                - 數據總結：${jsonData.summary.autoSummary}
                
                請根據以上數據做一個簡短的繁體中文分析，並說明 NAV 變動的主因。最後，請告訴使用者你可以針對這些數據回答更多細節。
            `;

            // 啟動對話模式
            chat = model.startChat({ history: [] });
            const result = await chat.sendMessage(context);
            const responseText = result.response.text();

            chatWindow.innerHTML = `<div class="bg-slate-800 p-4 rounded-lg text-gray-200 leading-relaxed shadow-inner border border-slate-700">${responseText}</div>`;
            inputArea.classList.remove('hidden');

        } catch (error) {
            chatWindow.innerHTML = `<div class="text-red-400">分析失敗：${error.message}</div>`;
            genBtn.style.display = 'block';
        }
    };

    // 2. 處理使用者後續提問
    window.handleUserQuery = async () => {
        const input = document.getElementById('user-input');
        const chatWindow = document.getElementById('chat-window');
        const text = input.value.trim();

        if (!text || !chat) return;

        // 顯示使用者問題
        chatWindow.innerHTML += `<div class="text-right"><span class="inline-block bg-blue-700 px-3 py-2 rounded-lg mt-4 shadow-md">${text}</span></div>`;
        input.value = '';

        // 顯示 AI 思考狀態
        const loadingMsg = document.createElement('div');
        loadingMsg.className = 'text-gray-500 text-xs italic mt-2';
        loadingMsg.innerText = 'AI 正在回覆中...';
        chatWindow.appendChild(loadingMsg);
        chatWindow.scrollTop = chatWindow.scrollHeight;

        try {
            const result = await chat.sendMessage(text);
            loadingMsg.remove();
            chatWindow.innerHTML += `<div class="bg-slate-800 p-3 rounded-lg text-gray-200 mt-2 border border-slate-700">${result.response.text()}</div>`;
        } catch (error) {
            loadingMsg.innerText = '抱歉，發生了點錯誤。';
        }
        chatWindow.scrollTop = chatWindow.scrollHeight;
    };
</script>
