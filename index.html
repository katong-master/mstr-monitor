<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAT.co 監測平台 - 專業儀表板</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <nav class="bg-white border-b border-gray-200 p-4">
        <div class="max-w-[1400px] mx-auto flex justify-between items-center">
            <span class="text-xl font-bold text-blue-600 tracking-tight">DAT.CO <span class="text-gray-800">MONITOR</span></span>
            <div class="flex items-center space-x-4 text-sm text-gray-500">
                <span class="flex items-center"><span class="w-2 h-2 bg-green-500 rounded-full mr-2"></span> System Live</span>
            </div>
        </div>
    </nav>

    <main class="max-w-[1400px] mx-auto py-8 px-6">
        
        <div class="flex flex-col md:flex-row md:items-end justify-between mb-8 gap-4">
            <div class="flex gap-4">
                <div class="bg-white px-4 py-2 rounded-lg shadow-sm border border-gray-200">
                    <span class="text-xs text-gray-400 block">Frequency</span>
                    <span class="font-mono font-bold text-gray-700">Daily Update</span>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-xl border border-gray-200 overflow-hidden mb-10">
            <div class="p-4 bg-gray-50 border-b border-gray-200 flex justify-between items-center">
                <span class="text-sm font-medium text-gray-600">Real-Time Treasury Analytics</span>
                <span class="text-xs text-blue-500 font-semibold">Source: Saylor Tracker</span>
            </div>
            
            <div class="w-full h-[650px] bg-slate-50">
                <iframe 
                    src="https://saylortracker.com/?tab=charts" 
                    class="w-full h-full border-0"
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 pb-12">
            <div class="bg-slate-900 p-6 rounded-xl shadow-lg text-white">
                <div class="flex items-center mb-4">
                    <div class="w-8 h-8 bg-blue-500 rounded-lg flex items-center justify-center mr-3">
                        <span class="text-xs">AI</span>
                    </div>
                    <h3 class="font-bold text-lg">Smart Insights</h3>
                </div>
                <p id="ai-output" class="text-gray-400 text-sm leading-relaxed mb-6">
                    點擊按鈕獲取基於最新 mNAV 數據的 AI 趨勢分析報告...
                </p>
                <button onclick="fetchAI()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg transition shadow-lg shadow-blue-900/20">
                    Generate Analysis
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 py-8 text-center text-gray-400 text-sm">
        <p>© 2026 FinTech Assignment - Digital Asset Monitor</p>
    </footer>

    <script>
        async function fetchAI() {
            const output = document.getElementById('ai-output'); 
            const btn = document.querySelector('button');
            const originalBtnText = btn.innerText;
            
            output.innerText = "正在讀取 indicator.json 並連線 Gemini AI...";
            btn.disabled = true;
            btn.innerText = "Analyzing...";

            try {
                // 1. 抓取剛剛由 Python 腳本更新的 indicator.json
                // 使用 ts=Date.now() 避免瀏覽器快取舊數據
                const response = await fetch(`./data/indicator.json?ts=${Date.now()}`);
                if (!response.ok) throw new Error("無法讀取數據檔案");
                
                const data = await response.json();
                
                // 2. 從 JSON 中提取最新摘要資訊 (對應你提供的數據結構)
                const s = data.summary;
                const promptData = `
                    日期: ${s.latestDate}
                    BTC 每股淨值 (NAV/Share): $${s.latestBtcNavPerDilutedShareUsd.toFixed(2)}
                    BTC 持倉量: ${s.latestBtcHoldings} BTC
                    BTC 價格: $${s.latestBtcPriceUsd}
                    30天 NAV 變化: ${s.navChange30dPct}%
                `;

                // 3. 送往你的 Vercel Serverless Function (/api/get-summary.js)
                const aiRes = await fetch('/api/get-summary', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: promptData })
                });

                if (!aiRes.ok) throw new Error("AI API 回應錯誤");

                const result = await aiRes.json();
                
                // 顯示 AI 生成的結果
                output.innerText = result.summary;

            } catch (error) {
                console.error(error);
                output.innerText = "分析失敗。請確認：\n1. data/indicator.json 內容正確\n2. Vercel 環境變數 GEMINI_API_KEY 已設定";
            } finally {
                btn.disabled = false;
                btn.innerText = originalBtnText;
            }
        }
    </script>

</body>
</html>
